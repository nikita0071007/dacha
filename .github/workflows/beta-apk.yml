name: Android 2.0 beta APK (isolated)
on:
  workflow_dispatch:
  push:
    branches: [feature/v2-test-build]
    paths: ['beta/**', 'scripts/bundle_beta.py', 'app/**', '.github/workflows/beta-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle offline beta assets
        run: |
          python3 scripts/bundle_beta.py
          python3 scripts/check_game.py app/src/main/assets/index.html
      - name: Build beta APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify beta APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: babushkina-dacha-2-beta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
