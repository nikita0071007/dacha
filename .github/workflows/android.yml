name: Android build (RuStore)
on:
  workflow_dispatch:
  push:
    branches: [rustore-no-pay]
    paths: ['android/**', 'rustore/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Положить свежую версию игры в приложение
        run: cp rustore/index.html android/app/src/main/assets/index.html
      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "Секрет KEYSTORE_BASE64 не задан — собираю БЕЗ подписи (только для проверки, в RuStore не загрузить)"
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi
      - name: Сборка
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: babushkina-dacha-${{ env.SIGNED == 'yes' && 'signed' || 'UNSIGNED' }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
