name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [feature/marina-wardrobe-v1]
    paths: ['index.html', 'app/**', '*.gradle', '.github/workflows/android-debug.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle game HTML for offline play
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: babushkina-dacha-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
