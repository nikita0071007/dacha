name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [feature/marina-wardrobe-v1]
    paths: ['index.html', 'app/**', '*.gradle', 'scripts/**', '.github/workflows/android-debug.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already contain an Android SDK.
      # android-actions/setup-android@v3 fails when it attempts to install the
      # obsolete SDK package "tools"; use the runner SDK directly instead.
      - name: Verify installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate game HTML and JavaScript
        run: python3 scripts/check_game.py
      - name: Bundle and validate fully offline Android game
        run: |
          python3 scripts/bundle_android.py
          python3 scripts/check_game.py app/src/main/assets/index.html
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: babushkina-dacha-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
