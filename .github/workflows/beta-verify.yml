name: Beta 2.0 Step 1 validation
on:
  workflow_dispatch:
  push:
    branches: [feature/v2-test-build]
    paths: ['beta/**', 'tools/**', 'CHANGELOG.md', 'ROADMAP_100.md', '.github/workflows/beta-verify.yml']
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check garden scales and take screenshots
        run: node tools/beta-layout.cjs beta/index.html beta/verify-out
      - name: Verify vegetables only on all 50 levels
        run: node tools/beta-harvest.cjs beta/index.html beta/verify-out
      - name: Play actual match-3 moves and check Marina poses
        run: node tools/beta-gameplay.cjs beta/index.html beta/verify-out
      - name: Check voluntary support is disabled without payment URL
        run: node tools/beta-support.cjs beta/support.js
      - name: Check WebAudio samples
        run: node tools/beta-music.cjs beta/index.html
      - name: Verify named pets and choice persistence
        run: node tools/beta-pets.cjs beta/index.html
      - name: Verify developer letter on three screens
        run: node tools/beta-letter.cjs beta/index.html beta/verify-out
      - name: Run Claude verification on beta
        env:
          BETA_BOT_TRIALS: '3'
        run: node tools/verify.js beta/index.html 50 beta/verify-out
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-step1-verification
          path: beta/verify-out/
          if-no-files-found: warn
